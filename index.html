<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAMBA STUDIO - Sauti Yako Real</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:12px;margin:0}
.card{background:#151515;padding:18px;border-radius:20px;max-width:440px;margin:auto;border:1px solid #222;text-align:center}
button{width:100%;padding:16px;border-radius:50px;border:none;font-weight:900;margin-top:10px;font-size:15px}
.main{background:#ffcc00;color:#000}
.sec{background:transparent;border:1px solid #ffcc00;color:#ffcc00}
audio{width:100%;margin-top:10px}
.wave{width:100%;height:60px;background:#111;border-radius:10px;margin:10px 0}
</style>
</head>
<body>
<div class="card">
<h2 style="color:#ffcc00">🎸 KAMBA + SAUTI YAKO</h2>
<p style="font-size:11px;color:#888">Sauti yako "eh eh" + Solo Kativoi original (hakuna copyright)</p>

<input type="file" id="voice" accept="audio/*" style="padding:10px;background:#222;border-radius:10px;width:100%;box-sizing:border-box">
<audio id="voicePlayer" controls style="display:none"></audio>
<canvas id="wave" class="wave"></canvas>

<button class="main" onclick="playMix()">▶️ SIKIZA: KAMBA + "eh eh" PAMOJA</button>
<button class="sec" onclick="stopAll()">⏹️ STOP</button>

<div id="status" style="margin-top:10px;color:#ffcc00;font-size:12px">Upload sauti yako ya "eh eh" kwanza, ama gusa play bila ku-upload uskie Kamba solo pekee</div>
</div>

<script>
let ctx, master, playing=false, voiceBuf=null, srcNodes=[];
let voiceUrl=null;

document.getElementById('voice').addEventListener('change', async e=>{
  let f=e.target.files[0]; if(!f) return;
  voiceUrl=URL.createObjectURL(f);
  let p=document.getElementById('voicePlayer'); p.src=voiceUrl; p.style.display='block';
  // decode
  let ab=await f.arrayBuffer();
  let tmp=new (window.AudioContext||window.webkitAudioContext)();
  voiceBuf=await tmp.decodeAudioData(ab);
  document.getElementById('status').innerHTML="✅ Sauti 'eh eh' loaded! Gusa SIKIZA";
});

// Kamba benga scale
const scale=[196,220,247,294,330,392,440];
function note(f,t,d,v=0.4){ let o=ctx.createOscillator(), g=ctx.createGain(); o.type="triangle"; o.frequency.value=f; o.connect(g); g.connect(master); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+d); o.start(t); o.stop(t+d+0.05); srcNodes.push(o); }
function kick(t){ note(75,t,0.4,"sine",0.9); }

function playMix(){
 stopAll();
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
 playing=true;
 let now=ctx.currentTime+0.2;
 let bpm=88, beat=60/bpm;

 // Kamba loop 14 sec kama Kativoi
 for(let bar=0; bar<7; bar++){
   let bt=now+bar*2;
   kick(bt);
   note(98,bt,0.6,0.7); // bass
   note(147,bt+0.68,0.5,0.5);
   note(196,bt+0.15,0.8,0.3);
   note(247,bt+0.5,0.5,0.28);
   // Solo Kativoi style bar 2,3,5
   if(bar==2||bar==3||bar==5){
     let pat=[0,2,4,6,6,5,4,2,0,2,4,5,7,5];
     pat.forEach((p,i)=>{ let f=scale[p%scale.length]*(i>7?2:1); note(f, bt+0.2+i*0.13, 0.22, 0.5); });
   }
 }
 // Sauti yako "eh eh" inacheza mara 3 kama chorus
 if(voiceBuf){
   for(let i=0;i<3;i++){
     let src=ctx.createBufferSource(); src.buffer=voiceBuf;
     src.connect(master); src.start(now+1+i*4.5); srcNodes.push(src);
   }
   document.getElementById('status').innerHTML="🎵 Inacheza: Kamba Benga + 'eh eh' yako (x3) - kama wimbo wa Kativoi!";
 } else {
   document.getElementById('status').innerHTML="🎸 Kamba solo pekee inacheza (original, kama Kativoi) - upload 'eh eh' ndio zichanganywe";
 }
 draw();
}
function stopAll(){ playing=false; srcNodes.forEach(n=>{try{n.stop()}catch{}}); srcNodes=[]; if(ctx) ctx.close(); }
function draw(){ let c=document.getElementById('wave'), x=c.getContext('2d'); c.width=400; function f(){ if(!playing) return; x.fillStyle="#111"; x.fillRect(0,0,400,60); x.fillStyle="#ffcc00"; for(let i=0;i<40;i++) x.fillRect(i*10,30-Math.random()*20,6,Math.random()*35); requestAnimationFrame(f);} f(); }
</script>
</body>
</html>
