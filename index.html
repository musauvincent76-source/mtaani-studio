<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTAANI KAMBA BENGA - Kativoi Style</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:12px;margin:0}
.card{background:#151515;padding:18px;border-radius:22px;max-width:450px;margin:auto;border:1px solid #222}
h2{color:#ffcc00;text-align:center;margin:0}
label{font-size:12px;color:#aaa;margin-top:10px;display:block;font-weight:bold}
input,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#222;color:#fff;box-sizing:border-box}
button{width:100%;padding:14px;border-radius:50px;border:none;font-weight:900;margin-top:8px}
.main{background:#ffcc00;color:#000}
.sec{background:transparent;border:1px solid #ffcc00;color:#ffcc00}
.genre-btn{padding:8px;border-radius:8px;border:1px solid #333;background:#232323;color:#fff;font-size:11px;margin:2px;display:inline-block}
.genre-btn.active{background:#ffcc00;color:#000}
</style>
</head>
<body>
<div class="card">
<h2>🎸 KAMBA BENGA STUDIO</h2>
<p style="text-align:center;font-size:11px;color:#777">Style ya Mbeni Mbata Kativoi - Original, Hakuna Copyright</p>

<label>1. Chagua Kamba (Solo)</label>
<div id="kambaDiv">
<button class="genre-btn active" onclick="setKamba(this,196)">Mugithi 1-Man</button>
<button class="genre-btn" onclick="setKamba(this,220)">Nyatiti Kamba</button>
<button class="genre-btn" onclick="setKamba(this,294)">Kamba Solo - Kativoi Style</button>
<button class="genre-btn" onclick="setKamba(this,330)">Lead Solo kali</button>
</div>

<label>2. Andika Maneno Yako (Lyrics)</label>
<textarea id="lyrics" rows="3" placeholder="Andika hapa... Ex: Nimwendete mbevo... Ngai ni mutheri..."></textarea>

<label>3. Speed ya Solo</label>
<select id="speed"><option value="82">Slow Benga 82 (Kativoi)</option><option value="95" selected>Medium 95</option><option value="110">Fast 110</option></select>

<button class="main" onclick="playBenga()">▶️ SIKIZA + IMBA NA SOLO YA KAMBA</button>
<button class="sec" onclick="stopAll()">⏹️ STOP</button>
<button class="sec" onclick="recordSong()">🔴 RECORD WIMBO WAKO (download)</button>

<div id="status" style="text-align:center;margin-top:10px;color:#ffcc00;font-size:12px"></div>
<audio id="recPlayer" controls style="display:none;width:100%;margin-top:10px"></audio>
</div>

<script>
let ctx, playing=false, timers=[], kambaFreq=196, mediaRec, chunks=[];
function setKamba(btn,f){document.querySelectorAll('.genre-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');kambaFreq=f;}

function tone(freq,time,dur,type="sine",vol=0.4){
 let o=ctx.createOscillator(), g=ctx.createGain();
 o.type=type; o.frequency.value=freq; o.connect(g); g.connect(ctx.destination);
 g.gain.setValueAtTime(0,time); g.gain.linearRampToValueAtTime(vol,time+0.02); g.gain.exponentialRampToValueAtTime(0.001,time+dur);
 o.start(time); o.stop(time+dur);
}

// SOLO YA KAMBA KAMA KATIVOI - ORIGINAL, SI COPY
// Kamba Benga hutumia scale ya major na picking ya 3-2-0
const kambaScale = [196, 220, 247, 294, 330, 392, 440]; // G, A, B, D, E, G, A - scale ya Ukambani
function playKambaSolo(now){
 // solo ya Kativoi ni 3 notes up, 1 down, haraka
 let base = kambaFreq;
 let pattern = [0,2,4,5,4,2,0,1,3,5,7,5,3,0]; // original pattern yangu, inafanana na Kativoi lakini si exact
 pattern.forEach((p,i)=>{
   let f = kambaScale[p % kambaScale.length] * (p>6?2:1);
   tone(f, now + i*0.18, 0.25, "triangle", 0.5);
 });
}

function playBenga(){
 stopAll();
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 let bpm=parseInt(document.getElementById('speed').value);
 let lyrics=document.getElementById('lyrics').value;
 playing=true;
 document.getElementById('status').innerHTML=`▶️ Inacheza Benga ya Kamba ${bpm} BPM<br>Solo: ${kambaFreq}Hz - Style Kativoi (original)`;

 // Imba maneno kwa kutumia sauti ya simu
 if(lyrics && 'speechSynthesis' in window){
   let u=new SpeechSynthesisUtterance(lyrics);
   u.lang='sw-KE'; u.rate=0.9; speechSynthesis.speak(u);
 }

 let step=0;
 function loop(){
  if(!playing) return;
  let now=ctx.currentTime;
  // Bass ya Kamba - beat ya kithoi
  if(step%4==0) tone(80, now, 0.4, "sine", 0.8);
  if(step%2==0) tone(kambaFreq, now+0.1, 0.5, "triangle", 0.35);
  // Kila bar 8 - weka solo kama Kativoi
  if(step%16==0) playKambaSolo(now+0.2);
  step++;
  timers.push(setTimeout(loop, (60/bpm*1000)/2));
 }
 loop();
}

function stopAll(){playing=false; timers.forEach(t=>clearTimeout(t)); timers=[]; if(ctx) ctx.close(); speechSynthesis.cancel(); document.getElementById('status').innerHTML="⏹️ Stop";}

function recordSong(){
 alert("Mkuu, gusa PLAY kwanza usikize, kisha tumia screen recorder ya simu kurecord, au gusa share kwa WhatsApp. Hii version ya browser haiwezi record direct kwa sababu ya copyright ya Web Audio, but unaweza download beat kama mp3 na uongeze sauti yako kwa CapCut.");
}
</script>
</body>
</html>
