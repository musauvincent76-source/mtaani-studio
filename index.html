<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTAANI STUDIO - Yako kama Frobits</title>
<style>
:root{--bg:#14121c;--pn:#1f1c2b;--ink:#f1ece0;--line:#322e45;--amber:#f2b632;--teal:#2bb3a3}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui;padding:20px}
main{max-width:500px;margin:auto}
.card{background:var(--pn);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h1{text-align:center;color:var(--amber);margin:0}
.sub{color:#9b97ad;text-align:center;font-size:13px}
textarea{width:100%;min-height:100px;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:14px;border-radius:30px;border:none;font-weight:900;margin-top:8px;cursor:pointer}
.gen{background:linear-gradient(90deg,var(--amber),#ff7a00);color:#14121c}
.go{background:var(--teal);color:#07201d}
.song{background:#0e0e0e;padding:12px;border-radius:10px;margin-top:10px;display:none}
audio{width:100%;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>MTAANI STUDIO</h1>
<p class="sub">Andika vibe yako - AI inatengeneza Kamba Benga yako kama Muchinah Motions in 2 min</p>

<div class="card">
<label style="font-size:12px;color:#9b97ad">Andika maneno / vibe (Kiswahili / Kikamba)</label>
<textarea id="vibe">Nimwendete mbevo ya muuo, Ngai ni mutheri wakwa, Kativoi witu - mapenzi ya Kamba, furaha shambani</textarea>
<div style="display:flex;gap:8px;margin-top:8px">
<select id="genre" style="flex:1;padding:10px;background:var(--bg);color:var(--ink);border-radius:8px;border:1px solid var(--line)">
<option value="Kamba Benga 90 BPM, G-D bass Kativoi, guitar solo tweng">Kamba Benga (kama video yako) 🔥</option>
<option value="Gengetone 100 BPM">Gengetone</option>
<option value="Bongo Flava">Bongo</option>
<option value="Afrobeat">Afrobeat</option>
</select>
</div>
<button class="gen" onclick="generate()">🎸 GENERATE NGOMA YANGU - 2 MIN</button>
<button class="go" onclick="generateInfinite()">🎲 GENERATE TOFAUTI (maelfu ya ngoma)</button>
<div id="status" style="text-align:center;margin-top:10px;color:var(--amber);font-size:13px"></div>
<div id="songBox" class="song">
<p id="songTitle" style="margin:0;font-weight:700"></p>
<audio id="player" controls></audio>
<button class="go" onclick="pay()">Lipa 100 KES via M-Pesa upakue full</button>
</div>
</div>

<div class="card">
<p style="font-size:13px;margin:0"><b>WhatsApp:</b> Watu watume tu kwa namba yako: <code style="color:var(--amber)">+2547XX XXX XXX</code><br>
Mfano: "Nipe Kamba Benga ya birthday ya mama"</p>
</div>
</main>

<script>
const API = "http://localhost:8000"; // Badilisha uki-deploy: https://mtaani.onrender.com

async function generate(){
  const vibe = document.getElementById('vibe').value;
  const genre = document.getElementById('genre').value;
  document.getElementById('status').innerText = "⏳ Natengeneza Kamba Benga yako... 30-120 sec";
  document.getElementById('songBox').style.display='none';

  try{
    let res = await fetch(API+'/generate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({vibe, genre, lang:'Kikamba'})
    });
    let data = await res.json();
    document.getElementById('status').innerText = "✅ Tayari! Ngoma #"+data.id;
    document.getElementById('songTitle').innerText = data.title;
    document.getElementById('player').src = data.audio_url;
    document.getElementById('songBox').style.display='block';
  }catch(e){
    document.getElementById('status').innerText = "Server bado haija-washwa. Soma README chini. Lakini prompt yako: "+genre+" + "+vibe;
  }
}

function generateInfinite(){
  // Kila finyo inabadilisha seed - maelfu ya ngoma tofauti
  let seeds = ["solo pattern A: 0-2-4-7", "solo pattern B: 2-5-7-9", "solo pattern C: 5-7-9-12", "bass G-D-A", "bass G-C-D"];
  let pick = seeds[Math.floor(Math.random()*seeds.length)];
  document.getElementById('genre').value = "Kamba Benga 90 BPM, "+pick+", guitar solo tweng Kativoi original";
  generate();
}

function pay(){
  let phone = prompt("Weka namba ya M-Pesa 07XX:");
  if(!phone) return;
  fetch(API+'/pay', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({phone, amount:100})})
 .then(r=>r.json()).then(d=>alert(d.message));
}
</script>
</body>
</html>
